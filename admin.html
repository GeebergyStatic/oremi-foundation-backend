<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    img {
      max-height: 250px;
      object-fit: cover;
    }

    .event-box {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }

    .btn-sm {
      margin-right: 5px;
    }

    #spinner {
      text-align: center;
      margin-top: 20px;
    }

    .progress-container {
      margin-top: 20px;
    }

    .progress-bar {
      width: 0;
      height: 20px;
    }

    /* Full-screen Loader */
    #loader {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: pulse 2s ease-in-out infinite;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }


    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <img class="img-fluid" src="https://cdn.oremiazibabenfoundation.org/genral-page-images/logo_main_copy.PNG"
      alt="Logo">
  </div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Admin Panel</h2>
      <button class="btn btn-danger" onclick="logoutAdmin()">Logout</button>
    </div>

    <form id="eventForm" class="mb-5">
      <textarea id="description" class="form-control mb-2" placeholder="Event description" required></textarea>
      <input type="file" id="images" class="form-control mb-2" multiple required />
      <button type="submit" id="uploadButton" class="btn btn-primary">
        Upload Event
        <span id="buttonSpinner" class="spinner-border spinner-border-sm text-light d-none" role="status"
          aria-hidden="true"></span>
      </button>
    </form>

    <div id="spinner" class="d-none">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
      <span class="ms-2">Uploading...</span>
    </div>

    <div id="progressContainer" class="d-none">
      <div id="progressList"></div>
    </div>
    <div id="eventContainer"></div>


  </div>

  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <script>
    window.onload = function () {
      const adminId = localStorage.getItem('oremi_admin_id');

      if (adminId) {
        document.getElementById("loader").classList.add("hide");

        setTimeout(() => {
          document.getElementById("loader").style.display = "none";
        }, 500);

      } else {
        window.location.href = '/';
      }
    };

    function logoutAdmin() {
      localStorage.removeItem('oremi_admin_id');
      window.location.href = '/';
    }

    // =========================
    // UPLOAD NEW EVENT
    // =========================

    document.getElementById('eventForm')
      .addEventListener('submit', async (e) => {

        e.preventDefault();

        const description =
          document.getElementById('description').value;

        const files =
          document.getElementById('images').files;

        const uploadButton =
          document.getElementById('uploadButton');

        const buttonSpinner =
          document.getElementById('buttonSpinner');

        const spinner =
          document.getElementById('spinner');

        const progressContainer =
          document.getElementById('progressContainer');

        const progressList =
          document.getElementById('progressList');

        if (!files.length) {
          return alert('Please select images');
        }

        uploadButton.disabled = true;

        buttonSpinner.classList.remove('d-none');
        spinner.classList.remove('d-none');
        progressContainer.classList.remove('d-none');

        progressList.innerHTML = '';

        try {

          const formData = new FormData();

          formData.append('description', description);

          for (let i = 0; i < files.length; i++) {

            const file = files[i];

            const progressBar = document.createElement('div');

            progressBar.className = 'progress mb-2';

            progressBar.innerHTML = `
        <div 
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          style="width: 100%">
            Compressing ${file.name}
        </div>
      `;

            progressList.appendChild(progressBar);

            // COMPRESS IMAGE
            const compressedFile =
              await imageCompression(file, {

                maxSizeMB: 1.5,
                maxWidthOrHeight: 1920,
                useWebWorker: true
              });

            const bar =
              progressBar.querySelector('.progress-bar');

            bar.innerText = `Uploading ${file.name}`;

            formData.append(
              'images',
              compressedFile,
              compressedFile.name
            );
          }

          const response = await fetch(
            'https://oremi-foundation-backend.onrender.com/api/upload-events',
            {
              method: 'POST',
              body: formData
            }
          );

          const data = await response.json();

          if (!response.ok) {

            throw new Error(
              data.error || 'Upload failed'
            );
          }

          alert('Event uploaded successfully!');

          location.reload();

        } catch (err) {

          console.error(err);

          alert(err.message || 'Upload failed');

        } finally {

          spinner.classList.add('d-none');

          buttonSpinner.classList.add('d-none');

          uploadButton.disabled = false;

          progressContainer.classList.add('d-none');
        }
      });

    // =========================
    // FETCH EVENTS
    // =========================

    async function fetchEvents() {

      try {

        const res = await fetch(
          'https://oremi-foundation-backend.onrender.com/api/retrieve-events'
        );

        const events = await res.json();

        const container = document.getElementById('eventContainer');

        container.innerHTML = '';

        events.forEach(event => {

          const section = document.createElement('div');

          section.className = 'event-box';

          // DESCRIPTION
          const desc = document.createElement('p');

          desc.innerHTML = `
            <strong>Description:</strong> ${event.description}
          `;

          section.appendChild(desc);

          // IMAGE ROW
          const imgRow = document.createElement('div');

          imgRow.className = 'row';

          event.images.forEach((url, index) => {

            const col = document.createElement('div');

            col.className = 'col-md-4 mb-3';

            const img = document.createElement('img');

            img.src = url;

            img.className = 'img-fluid rounded';

            img.loading = 'lazy';

            // DELETE IMAGE BUTTON
            const delBtn = document.createElement('button');

            delBtn.className = 'btn btn-sm btn-outline-danger mt-2';

            delBtn.textContent = 'Delete Image';

            delBtn.onclick = () => deleteImageFromEvent(
              event._id,
              event.imagePaths[index]
            );

            col.appendChild(img);

            col.appendChild(delBtn);

            imgRow.appendChild(col);
          });

          // CONTROLS
          const controls = document.createElement('div');

          controls.className = 'mt-3';

          controls.innerHTML = `
            <button 
              class="btn btn-sm btn-warning"
              onclick="editDescription('${event._id}')">
                Edit Description
            </button>
  
            <button 
              class="btn btn-sm btn-danger"
              onclick="deleteEvent('${event._id}')">
                Delete Event
            </button>
          `;

          // ADD IMAGES FORM
          const addForm = document.createElement('form');

          addForm.innerHTML = `
            <input 
              type="file"
              class="form-control mt-3"
              multiple
              id="addImages-${event._id}"
            />
  
            <button
              type="button"
              class="btn btn-success btn-sm mt-2"
              onclick="addImagesToEvent('${event._id}')">
                Add More Images
            </button>
          `;

          section.appendChild(imgRow);
          section.appendChild(controls);
          section.appendChild(addForm);

          container.appendChild(section);
        });

      } catch (err) {

        console.error(err);

        alert('Failed to fetch events');
      }
    }

    // =========================
    // DELETE SINGLE IMAGE
    // =========================

    async function deleteImageFromEvent(eventId, imagePath) {

      const confirmed = confirm(
        "Are you sure you want to delete this image?"
      );

      if (!confirmed) return;

      try {

        const res = await fetch(
          'https://oremi-foundation-backend.onrender.com/api/delete-image',
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              eventId,
              imagePath
            })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Delete failed');
        }

        location.reload();

      } catch (err) {

        console.error(err);

        alert(err.message || 'Failed to delete image');
      }
    }

    // =========================
    // EDIT DESCRIPTION
    // =========================

    async function editDescription(eventId) {

      const newDesc = prompt("Enter new description:");

      if (!newDesc) return;

      try {

        const res = await fetch(
          'https://oremi-foundation-backend.onrender.com/api/edit-event',
          {
            method: 'POST',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              eventId,
              newDescription: newDesc
            })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Update failed');
        }

        location.reload();

      } catch (err) {

        console.error(err);

        alert(err.message || 'Failed to update description');
      }
    }

    // =========================
    // DELETE ENTIRE EVENT
    // =========================

    async function deleteEvent(eventId) {

      const confirmed = confirm(
        "Delete the entire event?"
      );

      if (!confirmed) return;

      try {

        const res = await fetch(
          'https://oremi-foundation-backend.onrender.com/api/delete-event',
          {
            method: 'DELETE',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              eventId
            })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Delete failed');
        }

        location.reload();

      } catch (err) {

        console.error(err);

        alert(err.message || 'Failed to delete event');
      }
    }

    // =========================
    // ADD MORE IMAGES
    // =========================

    async function addImagesToEvent(eventId) {

      try {

        const fileInput = document.getElementById(
          `addImages-${eventId}`
        );

        const files = fileInput.files;

        if (!files.length) {
          return alert("Please select images");
        }

        const formData = new FormData();

        formData.append('eventId', eventId);

        for (let i = 0; i < files.length; i++) {
          formData.append('images', files[i]);
        }

        const res = await fetch(
          'https://oremi-foundation-backend.onrender.com/api/add-images',
          {
            method: 'POST',
            body: formData
          }
        );

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Upload failed');
        }

        alert('Images added successfully!');

        location.reload();

      } catch (err) {

        console.error(err);

        alert(err.message || 'Failed to add images');
      }
    }

    // =========================
    // INITIAL LOAD
    // =========================

    fetchEvents();

  </script>
</body>

</html>
